<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="heartFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff728b"/>
      <stop offset="55%" stop-color="#f45b78"/>
      <stop offset="100%" stop-color="#df3e63"/>
    </linearGradient>
    <linearGradient id="patchFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e84563"/>
      <stop offset="100%" stop-color="#b92545"/>
    </linearGradient>
  </defs>

  <!-- Main plush heart -->
  <path d="M512 901
           C445 849 145 638 99 373
           C62 160 298 74 430 204
           C470 243 493 286 512 330
           C531 286 554 243 594 204
           C726 74 962 160 925 373
           C879 638 579 849 512 901 Z"
