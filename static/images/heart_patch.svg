           C446 824 171 622 127 380
           C94 196 291 112 410 225
           C456 269 486 321 512 374
           C538 321 568 269 614 225
           C733 112 930 196 897 380
           C853 622 578 824 512 874 Z"
        fill="none"
        stroke="#c82d4d"
        stroke-width="8"
        opacity="0.8"/>

  <!-- Perimeter stitches -->
  <path d="M512 857
           C447 807 189 615 148 390
           C118 224 291 143 394 241
           C442 286 477 345 512 408
           C547 345 582 286 630 241
