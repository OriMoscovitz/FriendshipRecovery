    <path d="M191 714 L282 623"/>
    <path d="M222 746 L322 646"/>
    <path d="M254 771 L345 680" />
  </g>


    <g transform="translate(60 0)">
  <!-- Patch stitches -->
  <path d="M194 616
           C238 606 287 624 326 665
           C359 700 365 748 346 787"
        fill="none"
        stroke="#ffe3bf"
        stroke-width="12"
